{% extends "base.html" %}

{% block content %}

<section class="mt-container mt-form-page">
    <a href="{{ url_for('post.posts') }}" class="mt-back-link">← Volver a mis blogs</a>

    <div class="mt-eyebrow">// nuevo blog</div>
    <h1 class="mt-section-title">{% block title %}Crear Blog{% endblock %}</h1>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mt-field">
            <label for="title" class="mt-form-label">Título</label>
            <input type="text" class="mt-input" id="title" name="title" placeholder="Título del blog" required>
        </div>

        <div class="mt-field">
            <label for="info" class="mt-form-label">Descripción</label>
            <textarea class="mt-input mt-textarea" id="info" name="info" rows="3"
                placeholder="Breve descripción del blog"></textarea>
        </div>

        <div class="mt-field">
            <label for="contentInput" class="mt-form-label">Contenido</label>
            <div class="mt-editor-wrap">
                {{ ckeditor.create() }}
            </div>
        </div>

        <div class="mt-form-actions">
            <button type="submit" class="mt-btn mt-btn-lg">Guardar</button>
            <a href="{{ url_for('post.posts') }}" class="mt-btn-text">Cancelar</a>
        </div>
    </form>
</section>

{% endblock %}
